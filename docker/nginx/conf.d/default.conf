upstream in_spectra_api {
    server api:4000;
}

upstream in_spectra_trpc {
    server trpc:3000;
}

server {
    listen 80;
    server_name api.in-spectra.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.in-spectra.com;

    ssl_certificate /etc/letsencrypt/live/api.in-spectra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.in-spectra.com/privkey.pem;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;

    # TRPC endpoints -> Hono server (port 3000)
    location /api/trpc {
        proxy_pass http://in_spectra_trpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File uploads -> Hono server (port 3000)
    location /api/upload {
        client_max_body_size 50M;
        proxy_pass http://in_spectra_trpc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API endpoints -> Fastify server (port 4000)
    location / {
        proxy_pass http://in_spectra_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
